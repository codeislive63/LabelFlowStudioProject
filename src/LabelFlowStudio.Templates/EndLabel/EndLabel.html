<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        @page {
            size: 100mm 150mm;
            margin: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        .page {
            width: 100mm;
            height: 150mm;
            box-sizing: border-box;
            padding: 6mm;
            font-family: Segoe UI, Arial, sans-serif;
        }

        .title {
            font-size: 20pt;
            font-weight: 600;
            margin-bottom: 4mm;
        }

        .barcode {
            width: 100%;
            height: 22mm;
            object-fit: contain;
            margin-bottom: 4mm;
        }

        .weight {
            font-size: 16pt;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="title">TENAM {{TENAM}}</div>
        <img class="barcode" src="{{BARCODE_DATA_URL}}" alt="barcode" />
        <div class="weight">{{WEIGHT_TEXT}}</div>
    </div>
</body>
</html>
