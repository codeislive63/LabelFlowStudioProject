﻿
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor</title>

    <style>
        :root {
            --bg: #ffffff;
            --panel: #f6f7f9;
            --panel2: #eef0f3;
            --border: rgba(0,0,0,0.12);
            --text: rgba(0,0,0,0.88);
            --muted: rgba(0,0,0,0.58);
            --accent: #2563eb;
            --radius: 12px;
            --shadow: 0 10px 28px rgba(0,0,0,0.10);
            --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            --code: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Roboto Mono", monospace;
            --tokensWidth: 360px;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: hidden;
        }

        .root {
            height: 100%;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr var(--tokensWidth);
            transition: grid-template-columns 180ms ease;
            position: relative;
        }

            .root.tokensHidden {
                grid-template-columns: 1fr 0px;
            }

        .editorPane {
            display: grid;
            grid-template-rows: 1fr 28px;
            min-width: 0;
            min-height: 0;
            border-right: 1px solid var(--border);
        }

        #editor {
            min-width: 0;
            min-height: 0;
        }

        #fallback {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            padding: 12px;
            box-sizing: border-box;
            font-family: var(--code);
            font-size: 13px;
            line-height: 1.4;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
            user-select: none;
        }

        .tokensPanel {
            display: grid;
            grid-template-rows: 44px 1fr;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--bg);
            border-left: 1px solid var(--border);
            transition: opacity 140ms ease, transform 180ms ease;
            opacity: 1;
            transform: translateX(0);
        }

        .root.tokensHidden .tokensPanel {
            opacity: 0;
            transform: translateX(10px);
            pointer-events: none;
        }

        .tokensHeader {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            user-select: none;
        }

        .tokenSearch {
            flex: 1;
            height: 30px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.85);
            font-size: 13px;
            outline: none;
        }

            .tokenSearch:focus {
                border-color: rgba(37,99,235,0.35);
                box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
            }

        .iconBtn {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.85);
            cursor: pointer;
            display: grid;
            place-items: center;
        }

            .iconBtn:hover {
                border-color: rgba(37,99,235,0.35);
                box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
            }

        .tokensList {
            min-height: 0;
            overflow: auto;
            padding: 10px;
            background: var(--bg);
        }

        .token {
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.02);
            border-radius: var(--radius);
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            box-shadow: 0 1px 0 rgba(0,0,0,0.03);
        }

            .token:hover {
                border-color: rgba(37,99,235,0.35);
                box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
            }

            .token .label {
                font-family: var(--code);
                color: var(--text);
                font-size: 13px;
                margin-bottom: 6px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .token .detail {
                font-size: 12px;
                color: var(--muted);
                line-height: 1.35;
            }

        .tokensHandle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 64px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.92);
            box-shadow: var(--shadow);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .root.tokensHidden .tokensHandle {
            display: flex;
        }

        /* Было { } – теперь стрелка */
        .chevronIcon {
            font-family: var(--font);
            font-size: 18px;
            color: var(--muted);
            line-height: 1;
        }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.18);
            border-radius: 999px;
            border: 3px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body>
    <div id="root" class="root tokensHidden">
        <div class="editorPane">
            <div id="editor"></div>
            <textarea id="fallback" spellcheck="false"></textarea>

            <div class="status">
                <div id="leftStatus">Загрузка</div>
                <div id="rightStatus">HTML</div>
            </div>
        </div>

        <div id="tokensPanel" class="tokensPanel">
            <div class="tokensHeader">
                <input id="tokenSearch" class="tokenSearch" type="text" placeholder="Поиск" />
                <button id="closeTokensBtn" class="iconBtn" type="button" title="Скрыть">
                    ✕
                </button>
            </div>

            <div id="tokensList" class="tokensList"></div>
        </div>

        <button id="tokensHandle" class="tokensHandle" type="button" title="Токены">
            <span class="chevronIcon">‹</span>
        </button>
    </div>

    <script>
        const state = {
            editor: null,
            fallback: document.getElementById('fallback'),
            usingFallback: false,

            tokens: [],
            tokensHidden: true,
            filter: '',

            suppressChange: false,
            pendingInit: null,

            completionProviderDisposable: null,

            vsBaseUrl: null
        }

        const rootEl = document.getElementById('root')
        const editorHostEl = document.getElementById('editor')
        const tokensListEl = document.getElementById('tokensList')
        const tokenSearchEl = document.getElementById('tokenSearch')
        const tokensHandleEl = document.getElementById('tokensHandle')
        const closeTokensBtnEl = document.getElementById('closeTokensBtn')
        const leftStatusEl = document.getElementById('leftStatus')

        function post(message) {
            try {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(message)
                }
            } catch {
                // ignore
            }
        }

        function debounce(fn, delayMs) {
            let timerId = null
            return function () {
                const args = arguments
                if (timerId) {
                    clearTimeout(timerId)
                }
                timerId = setTimeout(() => fn.apply(null, args), delayMs)
            }
        }

        function escapeHtml(value) {
            return (value || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
        }

        function setTokensHidden(hidden, notifyHost) {
            state.tokensHidden = !!hidden

            if (state.tokensHidden) {
                rootEl.classList.add('tokensHidden')
            } else {
                rootEl.classList.remove('tokensHidden')
            }

            if (state.editor) {
                state.editor.layout()
                state.editor.focus()
            }

            if (notifyHost) {
                post({ type: 'tokensPanelToggled', hidden: state.tokensHidden })
            }
        }

        function renderTokens() {
            const filter = (state.filter || '').trim().toLowerCase()

            tokensListEl.innerHTML = ''

            const list = Array.isArray(state.tokens) ? state.tokens : []
            for (const t of list) {
                const label = (t && (t.label || '')) || ''
                const detail = (t && (t.detail || '')) || ''
                const insertText = (t && (t.insertText || t.label || '')) || ''

                if (filter) {
                    const hay = (label + ' ' + detail).toLowerCase()
                    if (!hay.includes(filter)) {
                        continue
                    }
                }

                const card = document.createElement('div')
                card.className = 'token'
                card.innerHTML =
                    `<div class="label">${escapeHtml(label)}</div>` +
                    `<div class="detail">${escapeHtml(detail)}</div>`

                card.addEventListener('click', () => {
                    insertTokenText(insertText)
                })

                tokensListEl.appendChild(card)
            }
        }

        function insertTokenText(text) {
            const value = text || ''

            if (state.editor) {
                const selection = state.editor.getSelection()
                if (!selection) {
                    return
                }

                state.editor.executeEdits('token', [{
                    range: selection,
                    text: value,
                    forceMoveMarkers: true
                }])

                state.editor.focus()
                return
            }

            if (state.usingFallback && state.fallback) {
                const el = state.fallback
                const start = el.selectionStart || 0
                const end = el.selectionEnd || 0
                const before = el.value.substring(0, start)
                const after = el.value.substring(end)

                el.value = before + value + after
                el.selectionStart = start + value.length
                el.selectionEnd = start + value.length
                el.focus()

                post({ type: 'contentChanged', value: el.value })
            }
        }

        function setValue(value, keepViewState) {
            const text = value || ''

            if (state.editor) {
                const viewState = keepViewState ? state.editor.saveViewState() : null

                state.suppressChange = true
                state.editor.setValue(text)
                state.suppressChange = false

                if (viewState) {
                    state.editor.restoreViewState(viewState)
                }

                state.editor.focus()
                return
            }

            if (state.usingFallback && state.fallback) {
                state.suppressChange = true
                state.fallback.value = text
                state.suppressChange = false
            }
        }

        function computeBraceReplaceRange(model, position) {
            const lineNumber = position.lineNumber
            const line = model.getLineContent(lineNumber)
            const cursorIndex = position.column - 1

            let braceCount = 0
            while (braceCount < 2) {
                const idx = cursorIndex - 1 - braceCount
                if (idx < 0) {
                    break
                }
                if (line[idx] !== '{') {
                    break
                }
                braceCount++
            }

            const startColumn = position.column - braceCount
            return new monaco.Range(lineNumber, startColumn, lineNumber, position.column)
        }

        function registerTokenCompletionProvider() {
            if (!window.monaco) {
                return
            }

            if (state.completionProviderDisposable) {
                state.completionProviderDisposable.dispose()
                state.completionProviderDisposable = null
            }

            state.completionProviderDisposable = monaco.languages.registerCompletionItemProvider('html', {
                triggerCharacters: ['{'],
                provideCompletionItems: function (model, position) {
                    const list = Array.isArray(state.tokens) ? state.tokens : []
                    const suggestions = []
                    let idx = 0

                    const range = computeBraceReplaceRange(model, position)

                    for (const t of list) {
                        if (!t) {
                            continue
                        }

                        const insert = (t.insertText || t.label || '')
                        const label = (t.label || insert)

                        if (!label) {
                            continue
                        }

                        suggestions.push({
                            label: label,
                            kind: monaco.languages.CompletionItemKind.Variable,
                            detail: t.detail || '',
                            insertText: insert,
                            range: range,
                            sortText: String(idx).padStart(5, '0')
                        })

                        idx++
                    }

                    return { suggestions: suggestions }
                }
            })
        }

        function applyInit(message) {
            state.tokens = message.tokens || []
            state.filter = ''
            tokenSearchEl.value = ''

            renderTokens()
            registerTokenCompletionProvider()

            setTokensHidden(!!message.tokensHidden, false)
            setValue(message.value || '', false)

            leftStatusEl.textContent = 'Готово'
        }

        function handleHostMessage(message) {
            if (!message || !message.type) {
                return
            }

            if (message.type === 'init') {
                if (!state.editor && !state.usingFallback) {
                    state.pendingInit = message
                    return
                }

                applyInit(message)
                return
            }

            if (message.type === 'setValue') {
                setValue(message.value || '', true)
                leftStatusEl.textContent = 'Импорт выполнен'
                return
            }
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script')
                script.src = src
                script.async = true
                script.onload = () => resolve()
                script.onerror = () => reject(new Error('Failed to load script: ' + src))
                document.head.appendChild(script)
            })
        }

        function loadCss(href) {
            return new Promise((resolve, reject) => {
                const link = document.createElement('link')
                link.rel = 'stylesheet'
                link.href = href
                link.onload = () => resolve()
                link.onerror = () => reject(new Error('Failed to load css: ' + href))
                document.head.appendChild(link)
            })
        }

        function ensureFallback() {
            state.usingFallback = true

            editorHostEl.style.display = 'none'
            state.fallback.style.display = 'block'

            state.fallback.addEventListener('input', debounce(() => {
                if (state.suppressChange) {
                    return
                }
                post({ type: 'contentChanged', value: state.fallback.value })
                leftStatusEl.textContent = 'Изменения не сохранены'
            }, 200))

            state.fallback.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                    e.preventDefault()
                    post({ type: 'saveRequested' })
                    leftStatusEl.textContent = 'Сохранение'
                }
            })
        }

        function isSuggestWidgetVisible() {
            return !!document.querySelector('.suggest-widget.visible')
        }

        async function tryStartMonaco(vsBaseUrl, loaderUrl, cssUrl) {
            try {
                await loadCss(cssUrl)
                await loadScript(loaderUrl)

                state.vsBaseUrl = vsBaseUrl

                window.MonacoEnvironment = {
                    getWorkerUrl: function () {
                        const workerMain = `${state.vsBaseUrl}/base/worker/workerMain.js`
                        const bootstrap =
                            `self.MonacoEnvironment = { baseUrl: '${state.vsBaseUrl}' };` +
                            `importScripts('${workerMain}');`

                        return `data:text/javascript;charset=utf-8,${encodeURIComponent(bootstrap)}`
                    }
                }

                window.require.config({ paths: { vs: state.vsBaseUrl } })

                await new Promise((resolve) => {
                    window.require(['vs/editor/editor.main'], function () {
                        state.editor = monaco.editor.create(editorHostEl, {
                            value: '',
                            language: 'html',
                            theme: 'vs',
                            automaticLayout: true,

                            minimap: { enabled: false },
                            fontFamily: state.editor ? undefined : 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Roboto Mono", monospace',
                            fontSize: 13,
                            lineHeight: 20,

                            wordWrap: 'on',
                            wrappingIndent: 'same',
                            scrollBeyondLastLine: false,
                            smoothScrolling: true,

                            tabSize: 2,
                            insertSpaces: true,
                            autoIndent: 'full',
                            formatOnPaste: true,
                            formatOnType: true,

                            quickSuggestions: true,
                            suggestOnTriggerCharacters: true,

                            scrollbar: {
                                verticalScrollbarSize: 12,
                                horizontalScrollbarSize: 12
                            },

                            fixedOverflowWidgets: true
                        })

                        // Ctrl+S
                        state.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
                            post({ type: 'saveRequested' })
                            leftStatusEl.textContent = 'Сохранение'
                        })

                        // QoL: фикс "Up прыгает на первую строку"
                        state.editor.onKeyDown((e) => {
                            if (e.keyCode !== monaco.KeyCode.UpArrow) {
                                return
                            }
                            if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) {
                                return
                            }
                            if (isSuggestWidgetVisible()) {
                                return
                            }

                            const model = state.editor.getModel()
                            const pos = state.editor.getPosition()
                            if (!model || !pos) {
                                return
                            }
                            if (pos.lineNumber <= 1) {
                                return
                            }

                            const newLine = pos.lineNumber - 1
                            const newColumn = Math.min(pos.column, model.getLineMaxColumn(newLine))

                            state.editor.setPosition({ lineNumber: newLine, column: newColumn })
                            state.editor.revealPositionInCenterIfOutsideViewport({ lineNumber: newLine, column: newColumn })

                            e.preventDefault()
                            e.stopPropagation()
                        })

                        const pushChange = debounce(() => {
                            post({ type: 'contentChanged', value: state.editor.getValue() })
                            leftStatusEl.textContent = 'Изменения не сохранены'
                        }, 180)

                        state.editor.onDidChangeModelContent(() => {
                            if (state.suppressChange) {
                                return
                            }
                            pushChange()
                        })

                        resolve()
                    })
                })

                return true
            } catch {
                return false
            }
        }

        async function start() {
            // WebView2 messages
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.addEventListener('message', (e) => handleHostMessage(e.data || {}))
            }

            // UI
            tokenSearchEl.addEventListener('input', () => {
                state.filter = tokenSearchEl.value || ''
                renderTokens()
            })

            tokensHandleEl.addEventListener('click', () => setTokensHidden(false, true))
            closeTokensBtnEl.addEventListener('click', () => setTokensHidden(true, true))

            // 1) local
            const localOk = await tryStartMonaco(
                'https://app/Editor/monaco/vs',
                'monaco/vs/loader.js',
                'monaco/vs/editor/editor.main.css'
            )

            // 2) CDN
            const cdnOk = localOk ? true : await tryStartMonaco(
                'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs',
                'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.css'
            )

            // 3) fallback
            if (!cdnOk) {
                ensureFallback()
            }

            // Ready handshake
            post({ type: 'ready' })

            if (state.pendingInit) {
                applyInit(state.pendingInit)
                state.pendingInit = null
            }

            if (state.editor) {
                state.editor.focus()
            } else if (state.usingFallback) {
                state.fallback.focus()
            }
        }

        start()
    </script>
</body>
</html>
