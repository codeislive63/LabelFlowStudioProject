<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor</title>
    <style>
        :root {
            --bg: #1f2126;
            --panel: #2b2d33;
            --panel2: #26282e;
            --border: rgba(255,255,255,0.10);
            --text: rgba(255,255,255,0.88);
            --muted: rgba(255,255,255,0.55);
            --accent: #4c8dff;
            --line: rgba(255,255,255,0.08);
            --code: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Roboto Mono", monospace;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            overflow: hidden;
        }

        .root {
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 320px;
        }

        .editorPane {
            display: grid;
            grid-template-rows: 34px 1fr 26px;
            border-right: 1px solid var(--border);
        }

        .tabs {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            background: var(--panel2);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            font-size: 13px;
            color: var(--muted);
            padding: 8px 2px;
            border-bottom: 2px solid transparent;
            user-select: none;
        }

            .tab.active {
                color: var(--text);
                border-bottom-color: var(--accent);
            }

        .editorArea {
            display: grid;
            grid-template-columns: 56px 1fr;
            overflow: hidden;
        }

        .gutter {
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 10px 0;
            font-family: var(--code);
            font-size: 13px;
            line-height: 20px;
            color: rgba(255,255,255,0.35);
            text-align: right;
            overflow: hidden;
            user-select: none;
        }

            .gutter div {
                padding: 0 10px;
            }

        .code {
            position: relative;
            background: var(--bg);
            padding: 10px 12px;
            overflow: auto;
            font-family: var(--code);
            font-size: 13px;
            line-height: 20px;
            outline: none;
            white-space: pre;
            tab-size: 2;
        }

            .code:focus {
                box-shadow: inset 0 0 0 1px rgba(76,141,255,0.25);
            }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            background: var(--panel2);
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
            user-select: none;
        }

        .side {
            display: grid;
            grid-template-rows: 34px 1fr;
        }

        .sideHeader {
            display: flex;
            align-items: center;
            padding: 0 12px;
            background: var(--panel2);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--muted);
        }

        .tokens {
            overflow: auto;
            padding: 10px;
            background: var(--bg);
        }

        .token {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

            .token:hover {
                border-color: rgba(76,141,255,0.45);
            }

            .token .label {
                font-family: var(--code);
                color: var(--text);
                font-size: 13px;
                margin-bottom: 6px;
            }

            .token .detail {
                font-size: 12px;
                color: var(--muted);
            }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.14);
            border-radius: 999px;
            border: 3px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="root">
        <div class="editorPane">
            <div class="tabs">
                <div class="tab active">endlabel.html</div>
            </div>

            <div class="editorArea">
                <div id="gutter" class="gutter"></div>
                <div id="code" class="code" contenteditable="true" spellcheck="false"></div>
            </div>

            <div class="status">
                <div id="leftStatus">Готово</div>
                <div id="rightStatus">Ctrl+S</div>
            </div>
        </div>

        <div class="side">
            <div class="sideHeader">Tokens</div>
            <div id="tokens" class="tokens"></div>
        </div>
    </div>

    <script>
        const codeEl = document.getElementById('code')
        const gutterEl = document.getElementById('gutter')
        const tokensEl = document.getElementById('tokens')
        const leftStatus = document.getElementById('leftStatus')

        let suppress = false
        let debounce = null
        let tokens = []

        function post(msg) {
            try {
                if (window.chrome && chrome.webview) {
                    chrome.webview.postMessage(msg)
                }
            } catch { }
        }

        function getText() {
            // contenteditable keeps \n in textContent
            return codeEl.textContent || ''
        }

        function setText(value) {
            suppress = true
            codeEl.textContent = value || ''
            suppress = false
            updateGutter()
        }

        function updateGutter() {
            const text = getText()
            const lines = Math.max(1, text.split('\n').length)
            let html = ''
            for (let i = 1; i <= lines; i++) {
                html += `<div>${i}</div>`
            }
            gutterEl.innerHTML = html
        }

        function insertAtCursor(text) {
            codeEl.focus()
            const sel = window.getSelection()
            if (!sel || sel.rangeCount === 0) {
                document.execCommand('insertText', false, text)
                return
            }
            const range = sel.getRangeAt(0)
            range.deleteContents()
            range.insertNode(document.createTextNode(text))
            range.collapse(false)
            sel.removeAllRanges()
            sel.addRange(range)
            updateGutter()
            scheduleChanged()
        }

        function renderTokens() {
            tokensEl.innerHTML = ''
            for (const t of tokens) {
                const card = document.createElement('div')
                card.className = 'token'
                card.innerHTML = `<div class="label">${escapeHtml(t.label)}</div><div class="detail">${escapeHtml(t.detail || '')}</div>`
                card.addEventListener('click', () => insertAtCursor(t.insertText || t.label))
                tokensEl.appendChild(card)
            }
        }

        function escapeHtml(s) {
            return (s || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        }

        function scheduleChanged() {
            if (suppress) return
            if (debounce) clearTimeout(debounce)
            debounce = setTimeout(() => {
                post({ type: 'contentChanged', value: getText() })
                leftStatus.textContent = 'Изменения не сохранены'
            }, 180)
        }

        codeEl.addEventListener('input', () => {
            updateGutter()
            scheduleChanged()
        })

        codeEl.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault()
                post({ type: 'saveRequested' })
                leftStatus.textContent = 'Сохранение'
                return
            }
            if (e.key === 'Tab') {
                e.preventDefault()
                insertAtCursor('  ')
            }
        })

        // init handshake
        post({ type: 'ready' })

        // receive init / setValue
        if (window.chrome && chrome.webview) {
            chrome.webview.addEventListener('message', (e) => {
                const msg = e.data || {}
                if (msg.type === 'init') {
                    tokens = msg.tokens || []
                    renderTokens()
                    setText(msg.value || '')
                    leftStatus.textContent = 'Готово'
                    return
                }
                if (msg.type === 'setValue') {
                    setText(msg.value || '')
                    leftStatus.textContent = 'Импорт выполнен'
                    return
                }
            })
        }

        updateGutter()
    </script>
</body>
</html>
